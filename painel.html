<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clientes · Kantatuga QR</title>
    <link rel="stylesheet" href="css/app.css">
    <script>if (!localStorage.getItem('qr_token')) location.replace("index.html");</script>
</head>
<body>
    <div class="app">
        <aside class="sidebar">
            <div class="brand">
                <span class="brand-mark">
                    <svg class="i" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><path d="M14 14h3v3h-3zM20 14v.01M14 20h.01M17 20h4v-3"/></svg>
                </span>
                Kantatuga QR
            </div>

            <nav class="nav">
                <div class="nav-label">Menu</div>
                <a href="painel.html" class="active">
                    <svg class="i" viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg>
                    Clientes
                    <span class="count" id="nav-count">0</span>
                </a>
                <a href="backup.html">
                    <svg class="i" viewBox="0 0 24 24"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"/><path d="M3 12c0 1.66 4 3 9 3s9-1.34 9-3"/></svg>
                    Backup
                </a>
            </nav>

            <div class="sidebar-foot">
                <div class="user-chip">
                    <div class="avatar">K</div>
                    <div><strong>kantatuga</strong><small>Administrador</small></div>
                </div>
                <button class="btn btn-ghost logout" id="logout">
                    <svg class="i" viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg>
                    <span>Terminar sessão</span>
                </button>
            </div>
        </aside>

        <main class="main">
            <header class="page-head">
                <div>
                    <div class="kicker">Menu · Clientes</div>
                    <h1>Clientes <span id="total">0</span></h1>
                </div>
                <div class="head-actions">
                    <div class="input search">
                        <svg class="i" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
                        <input id="search" placeholder="Procurar cliente ou link">
                    </div>
                    <button class="btn btn-primary" id="new-btn">
                        <svg class="i" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
                        Novo QR code
                    </button>
                </div>
            </header>

            <div id="list" class="loading">A carregar…</div>
        </main>
    </div>

    <!-- Novo QR code -->
    <div class="modal-backdrop" id="new-modal" hidden>
        <form class="modal" id="new-form">
            <div class="modal-body">
                <h2>Novo QR code</h2>
                <p class="sub">O QR code (200 × 200 px) abre o link do site do cliente.</p>
                <div class="field">
                    <label for="f-name">Nome do cliente</label>
                    <div class="input">
                        <svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>
                        <input id="f-name" placeholder="Ex.: Restaurante Mar Azul" maxlength="120" required>
                    </div>
                </div>
                <div class="field">
                    <label for="f-url">Link do site</label>
                    <div class="input">
                        <svg class="i" viewBox="0 0 24 24"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>
                        <input id="f-url" placeholder="https://www.exemplo.pt" required>
                    </div>
                </div>
                <div class="error-msg" id="new-error"></div>
                <div class="modal-actions">
                    <button type="button" class="btn btn-ghost" data-close>Cancelar</button>
                    <button type="submit" class="btn btn-primary" id="save-btn">
                        <svg class="i" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></svg>
                        Criar QR code
                    </button>
                </div>
            </div>
            <div class="modal-preview">
                <div class="label">Pré-visualização</div>
                <div id="preview"><div class="placeholder">Escreva o link para ver o QR code</div></div>
                <div class="size">200 × 200 px · PNG</div>
            </div>
        </form>
    </div>

    <!-- Confirmar eliminação -->
    <div class="modal-backdrop" id="del-modal" hidden>
        <div class="modal small">
            <div class="modal-body">
                <h2>Eliminar QR code?</h2>
                <p class="sub" id="del-text"></p>
                <div class="modal-actions">
                    <button type="button" class="btn btn-ghost" data-close>Cancelar</button>
                    <button type="button" class="btn btn-danger" id="del-confirm">
                        <svg class="i" viewBox="0 0 24 24"><path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6"/></svg>
                        Eliminar
                    </button>
                </div>
            </div>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script src="vendor/qrcode.js"></script>
    <script src="js/config.js"></script>
    <script src="js/api.js"></script>
    <script src="js/painel.js"></script>
</body>
</html>
